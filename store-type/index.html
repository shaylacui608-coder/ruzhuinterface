<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>选择您的经营类型 · 来客入驻</title>
<style>
:root{font-family:"PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101011;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f7f9fc}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit}
.phone{width:375px;height:100dvh;min-height:700px;max-height:900px;position:relative;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.status{height:44px;flex:none;position:relative;background:#fff}
.status img{position:absolute;left:34.54px;top:17.38px}
.nav{height:52px;flex:none;display:flex;align-items:center;justify-content:center;padding:15px 52px;position:relative;font-size:17px;line-height:22px;font-weight:500;background:#fff}
.nav img{position:absolute;left:23.5px;top:18px}
.title{flex:none;background:#fff;padding:24px 20px}
.title h1{margin:0;font-size:24px;line-height:36px;font-weight:500;letter-spacing:0}
.content{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:#fff;padding-bottom:16px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.choices{padding:0 20px 20px;display:flex;flex-direction:column;gap:16px}
.choice{width:100%;height:92px;flex:none;border:0;border-radius:20px;background:#fff;padding:15px 16px;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;transition:background-color .24s ease,transform .16s ease}
.choice:active{transform:scale(.992)}
.choice[aria-checked=true]{background:#f0f6ff}
.choice-icon{width:52px;height:52px;object-fit:cover;flex:none}
.choice-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.choice-title{font-size:15px;line-height:22px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .24s ease}
.choice[aria-checked=true] .choice-title{color:#387aff}
.choice-desc{font-size:12px;line-height:18px;font-weight:400;color:rgba(0,4,19,.67);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.radio{width:18px;height:18px;border:0;border-radius:50%;background:#eceef2;flex:none;position:relative;margin:0 1px}
.choice[aria-checked=true] .radio{background:#387aff}
.choice[aria-checked=true] .radio:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;left:4px;top:4px}
.detail{padding:20px 16px 0;animation:appear .28s ease both}
.detail[hidden]{display:none}
@keyframes appear{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.section-title{font-size:17px;line-height:22px;font-weight:500;margin:0}
.material-list{margin-top:20px;display:flex;flex-direction:column;gap:16px}
.material{display:flex;align-items:center;gap:12px;min-height:60px}
.thumb{width:77px;height:60px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafafa}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.thumb.identity{position:relative;background:#fff}
.thumb.identity img{position:absolute;width:52.3px;height:32.874px;border:0;border-radius:4px}
.thumb.identity img:first-child{left:3px;top:6px;transform:rotate(-11.34deg)}
.thumb.identity img:last-child{left:18px;top:16px;transform:rotate(4deg)}
.material-title{font-size:13px;line-height:20px;font-weight:500;color:rgba(1,2,4,.94)}
.material-desc{font-size:12px;line-height:18px;font-weight:400;color:rgba(1,5,19,.56);margin-top:2px}
.timeline{position:relative;margin-top:20px;padding-left:19px}
.timeline:before{content:"";position:absolute;left:3px;top:7px;bottom:0;width:2px;border-radius:100px;background:rgba(79,83,92,.04)}
.steps{min-width:0;display:flex;flex-direction:column;gap:16px}
.step-row{position:relative;min-width:0}
.step-row:before{content:"";position:absolute;left:-19px;top:7px;width:7px;height:7px;border-radius:50%;background:#64676c;z-index:1}
.step-label{font-size:15px;line-height:22px;font-weight:500}
.step-upload{display:flex;flex-direction:column;gap:12px}
.upload-cards{display:flex;flex-direction:column;gap:8px}
.upload-card{min-height:80px;border-radius:10px;background:rgba(0,0,0,.02);padding:10px 12px;display:flex;align-items:center;gap:20px;overflow:hidden}
.upload-copy{flex:1;min-width:0}
.upload-image{width:84px;height:60px;flex:none;object-fit:contain;border-radius:4px}
.footer{height:90px;flex:none;background:#fff;padding:0 16px;z-index:2}
.next{width:100%;height:48px;border:0;border-radius:999px;background:#387aff;color:#fff;font-size:17px;line-height:22px;font-weight:500;cursor:pointer;margin-top:0;transition:background .18s,transform .18s}
.next:active{background:#286aef;transform:scale(.99)}
.home{height:34px;position:relative}
.home:after{content:"";position:absolute;width:134px;height:5px;left:50%;bottom:9px;transform:translateX(-50%);border-radius:100px;background:#34373e}
@media(max-width:375px){.phone{width:100vw}}
@media(max-height:760px){.phone{min-height:0}.content{padding-bottom:14px}.footer{height:82px}.home{height:26px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="phone" aria-label="来客入驻，选择经营类型">
  <div class="status"><img src="assets/status-bar.svg" alt="9:41"></div>
  <header class="nav"><img src="assets/arrow-left.svg" alt=""><span>来客入驻</span></header>
  <div class="title"><h1>选择您的经营类型</h1></div>
  <div class="content">
    <div class="choices" role="radiogroup" aria-label="经营类型">
      <button class="choice" type="button" role="radio" aria-checked="true" data-type="single">
        <img class="choice-icon" src="assets/store-single.png" alt="">
        <span class="choice-copy"><span class="choice-title">我只经营一家门店</span><span class="choice-desc">只需认领门店就能快速入驻</span></span>
        <span class="radio" aria-hidden="true"></span>
      </button>
      <button class="choice" type="button" role="radio" aria-checked="false" data-type="multi">
        <img class="choice-icon" src="assets/store-multiple.png" alt="">
        <span class="choice-copy"><span class="choice-title">我经营多家店或非到店业务</span><span class="choice-desc">需要手动选择你的经营行业</span></span>
        <span class="radio" aria-hidden="true"></span>
      </button>
    </div>
    <section class="detail" id="single-detail" aria-live="polite">
      <h2 class="section-title">入驻所需材料</h2>
      <div class="material-list">
        <div class="material"><div class="thumb"><img src="assets/business-license.png" alt="营业执照示例"></div><div><div class="material-title">营业执照</div><div class="material-desc">个体工商户营业执照、企业营业执照等任意一种</div></div></div>
        <div class="material"><div class="thumb identity"><img src="assets/identity-front.png" alt=""><img src="assets/identity-back.png" alt="法人身份证示例"></div><div><div class="material-title">法人身份证</div><div class="material-desc">法人身份证、护照、港澳台通行证任意一种</div></div></div>
        <div class="material"><div class="thumb"><img src="assets/industry-license.png" alt="行业资质示例"></div><div><div class="material-title">行业资质</div><div class="material-desc">食品经营许可证等资质（具体以页面展示为准）</div></div></div>
      </div>
    </section>
    <section class="detail" id="multi-detail" aria-live="polite" hidden>
      <h2 class="section-title">入驻步骤</h2>
      <div class="timeline">
        <div class="steps">
          <div class="step-row"><div class="step-label">选择行业</div></div>
          <div class="step-row step-upload">
            <div class="step-label">上传资质</div>
            <div class="upload-cards">
              <div class="upload-card"><div class="upload-copy"><div class="material-title">营业执照</div><div class="material-desc">个体工商户营业执照、企业营业执照等任意一种</div></div><img class="upload-image" src="assets/business-license.png" alt="营业执照示例"></div>
              <div class="upload-card"><div class="upload-copy"><div class="material-title">行业资质</div><div class="material-desc">食品经营许可证等资质（具体以页面展示为准）</div></div><img class="upload-image" src="assets/industry-license.png" alt="行业资质示例"></div>
              <div class="upload-card"><div class="upload-copy"><div class="material-title">品牌资质</div><div class="material-desc">品牌授权书或商标注册证中的任意一项</div></div><img class="upload-image" src="assets/brand-qualification.png" alt="品牌授权书示例"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <footer class="footer"><button class="next" type="button">确认，下一步</button><div class="home" aria-hidden="true"></div></footer>
</main>
<script>
const options=[...document.querySelectorAll(".choice")];
const details={single:document.getElementById("single-detail"),multi:document.getElementById("multi-detail")};
function selectType(type){
  options.forEach(option=>option.setAttribute("aria-checked",String(option.dataset.type===type)));
  Object.entries(details).forEach(([key,detail])=>{
    detail.hidden=key!==type;
    if(key===type){detail.classList.remove("detail");void detail.offsetWidth;detail.classList.add("detail");}
  });
  document.querySelector(".content").scrollTop=0;
}
options.forEach(option=>option.addEventListener("click",()=>selectType(option.dataset.type)));
</script>
</body>
</html>
